services:
  db:
    image: mongo:7
    container_name: order-center-db
    restart: unless-stopped
    volumes:
      - ./.runtime/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: order-center-backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://db:27017/global-order
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    container_name: order-center-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:6106:80"
    depends_on:
      - backend
